services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: excursium
      POSTGRES_USER: excursium
      POSTGRES_PASSWORD: excursium
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excursium -d excursium"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE__DB_HOST: postgres
      DATABASE__DATABASE_URL: postgresql+asyncpg://excursium:excursium@postgres:5432/excursium
      MINIO__MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
