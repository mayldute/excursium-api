[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "excursium-backend"
version = "1.0.0"
description = "Modular async FastAPI backend for a passenger transport marketplace."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=23.1,<26",
    "authlib>=1.6,<2",
    "asyncpg>=0.30,<1",
    "bcrypt>=4,<5",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "minio>=7.2,<8",
    "passlib>=1.7,<2",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "python-jose[cryptography]>=3.5,<4",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]


[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]


[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]


[tool.coverage.run]
source = ["app"]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = true


[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["alembic/versions"]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
